<!-- Runs before the stylesheet so the chosen theme is on <html> at first
     paint. Without this, a light-theme visitor sees a black flash on load.
     Dark is the default regardless of the OS setting; light only if picked. -->
<script>
(function(){
  try{
    var saved = localStorage.getItem('theme')
    var t = saved === 'light' ? 'light' : 'dark'
    document.documentElement.setAttribute('data-theme', t)
    if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content','#F5F5F2')
  }catch(e){ document.documentElement.setAttribute('data-theme','dark') }
})()
</script>
